# The battery on GitHub's Linux runners; macOS judges the coverage floor. Started by hand until
# the repositories are public.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Every `uv run` refuses a lock that no longer matches pyproject.toml instead of re-resolving.
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        timeout-minutes: 5
      - run: uv sync
        timeout-minutes: 5
      - run: uv run ruff check .
      - run: uv run mypy --strict .
      - run: uv run mypy --strict --platform win32 .
      # The coverage floor counts every platform branch of the tree as macOS runs it, so it is
      # judged there; here the suite judges behaviour.
      - run: uv run pytest -q --no-cov -rs
