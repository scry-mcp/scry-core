# The unit tiers on GitHub's Linux runners; the live tiers need an emulator and a display, and run
# on the maintainers' macOS and Windows hosts. Started by hand until the repositories are public.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        timeout-minutes: 5
      - run: uv sync --frozen
        timeout-minutes: 5
      - run: uv run ruff check .
      - run: uv run mypy --strict .
      - run: uv run mypy --strict --platform win32 .
      # The coverage floor counts every platform branch of the tree as macOS runs it, so it is
      # judged there; here the suite judges behaviour.
      - run: uv run pytest -q --no-cov
