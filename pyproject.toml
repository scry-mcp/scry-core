[project]
name = "scry-core"
version = "0.1.0"
description = "What the Scry emulator MCP servers share: the reply contract, the probe and the live bench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # UPPER-BOUNDED on purpose: `MCPServer` is a 2.x API, and `strict_arguments` rides on its
    # internals. Without the bound a future 3.x installs cleanly and then fails at import, which
    # is a broken install that looks like a broken server.
    "mcp>=2.1.0,<3",
    # `strict_arguments` builds pydantic models itself, so the bound is this package's to state
    # rather than one it inherits through `mcp`.
    "pydantic>=2,<3",
]

[project.optional-dependencies]
# `reply_shapes` is a pytest fixture module: a suite that loads it from its root conftest
# installs this extra in its test tier.
pytest = ["pytest>=8.0"]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["scry_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "W"]
# N818 wants every exception renamed to `...Error`. The concept is called INVALID across every
# tool here (exit code 3, and the word the programs print), so the class that raises it is
# `Invalid`: one spelling per concept outranks a generic naming convention.
ignore = ["N818"]

[tool.mypy]
# NO PATH LIST: a hand-kept list of directories is always one short of the tree.
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--cov` IS HERE SO EVERY `pytest` JUDGES THE FLOOR: without the flag pytest-cov measures nothing
# and never evaluates `fail_under`, so a bare run exits 0 having judged nothing. A partial run goes red on the floor by
# construction, because the floor is the whole package's: pass `--no-cov` for one of those.
addopts = "--cov"

[tool.coverage.run]
branch = true
source = ["scry_core", "tests"]

[tool.coverage.report]
# THE FLOOR IS THE VENDOR'S: coverage.py's `fail_under`, judged by pytest-cov at the end of every
# `--cov` run. The number is the total the run that fixed it measured, raised by hand from a run.
# It counts lines EXECUTED, not asserted: what proves a test bites is having seen it red.
fail_under = 99.33
precision = 2
show_missing = true
