[project]
name = "scry-core"
version = "0.97.1"
description = "What the Scry emulator MCP servers share, held once: the reply contract, captures and their comparisons, screen maps, the demo runner, the probe and the live bench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # UPPER-BOUNDED on purpose: `strict_arguments` rides on `MCPServer`'s internals and `demo` on
    # the client's, which belong to the pinned major. Without the bound the next major installs
    # cleanly and then fails at import, which is a broken install that looks like a broken server.
    "mcp>=2.1.0,<3",
    # `strict_arguments` builds pydantic models itself, so the bound is this package's to state
    # rather than one it inherits through `mcp`.
    "pydantic>=2,<3",
    # `reply_schema`'s models are `TypedDict`s pydantic reads, and below Python 3.12 pydantic
    # takes only this package's spelling of it. Already installed beside pydantic.
    "typing-extensions>=4.12",
    # Names a server's process (`process_name`, which says why). 1.3 is where the Activity
    # Monitor gets the name too; the major is bounded as above.
    "setproctitle>=1.3,<2",
]

[project.entry-points.pytest11]
# The shape guard's plugin (`reply_shapes_guard` says why it is one); pytest comes from the suite.
reply_shapes = "scry_core.reply_shapes"
# The window tier's marker and fixture, served to every suite with this package installed.
window_tier = "scry_core.window_tier"
# A home and a temp folder of the run's own, for a suite that asks with `private_run = true`.
private_run = "scry_core.private_run"

[dependency-groups]
# `jsonschema` is what the SDK's client validates a reply with; the tests run the same validator
# over the published `outputSchema`, so a schema a real client would refuse is red here.
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scry_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "W"]
# N818 wants every exception renamed to `...Error`. The concept is called INVALID across every
# tool here (exit code 3, and the word the programs print), so the class that raises it is
# `Invalid`: one spelling per concept outranks a generic naming convention.
ignore = ["N818"]

[tool.mypy]
# NO PATH LIST: a hand-kept list of directories is always one short of the tree.
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The battery runs with a home and a temp folder of its own and fails on a file left in that
# home (`scry_core.private_run`); pytest removes a green run's base temp and keeps a failed one's.
private_run = true
tmp_path_retention_policy = "failed"
# `--cov` IS HERE SO EVERY `pytest` JUDGES THE FLOOR: without the flag pytest-cov measures nothing
# and never evaluates `fail_under`, so a bare run exits 0 having judged nothing. A partial run
# goes red on the floor by construction, because the floor is the whole package's: pass
# `--no-cov` for one of those. `pytester` runs the shape guard on suites of the test's own.
addopts = "-m 'not window' --cov -p pytester"
# The core's own anchor: the contract every server's envelope goes through.
reply_shapes_anchors = ["scry_core.reply_contract", "scry_core.boundary"]

[tool.coverage.run]
branch = true
source = ["src/scry_core", "tests"]
# The plugins, imported through their entry points before coverage starts (`reply_shapes.py`
# says so; `private_run`'s cases run it through pytester), and the one test module that only a
# Windows desktop can execute (its skip is its whole body on macOS).
omit = ["src/scry_core/reply_shapes.py", "src/scry_core/window_tier.py",
        "src/scry_core/private_run.py",
        "tests/test_window_host_windows.py"]

[tool.coverage.report]
# THE FLOOR IS THE VENDOR'S: coverage.py's `fail_under`, judged by pytest-cov at the end of every
# `--cov` run. The number is the total the run that fixed it measured, raised by hand from a run.
# It counts lines EXECUTED, not asserted: what proves a test bites is having seen it red.
fail_under = 99.44
# A branch or a test only Windows runs: the floor is judged on macOS, where neither can execute.
# `# needs the desk` marks what moves the owner's Space or front application (the shims
# `window_host.switch_space` and `activate_app`, the stand-in windows of `window_stand_ins` and
# their tests): it runs only with SCRY_FOCUS_CONTROL=1, like the focus control, so the default
# battery cannot execute it. The choices around them are
# measured by the default battery.
exclude_also = ['if sys\.platform == "win32":', '@WINDOWS_ONLY', '# needs the desk$']
precision = 2
show_missing = true
